services:
  - type: web
    name: still-logbook
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm install && npm run build
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: STILL_DB_PATH
        value: data/still.sqlite3
      - key: STILL_SEED_ON_FIRST_RUN
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 24.13.0
